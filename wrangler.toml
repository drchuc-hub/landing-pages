name = "landing-pages"
compatibility_date = "2024-01-01"
main = "_worker.js"

# LƯU Ý: route trang tĩnh PHẢI có "*" ở đuôi. Route exact (không "*") bỏ sót
# request kèm query string (?fbclid/?utm_ của quảng cáo) → đi thẳng origin
# WordPress → 404 (sự cố /tu-van-1-1?cb= ngày 22/07/2026).
# Wildcard trùng prefix trang WP giờ AN TOÀN: _worker.js đã fallback về
# WordPress khi thiếu asset (vá sau sự cố 1101 /cam-on-tai-lieu-mat-co/ 21/07/2026).
# Thêm trang tĩnh mới = thêm file .html + thêm route "<slug>*" ở đây rồi deploy.
routes = [
  { pattern = "drchuc.com/api/sepay-webhook", zone_name = "drchuc.com" },

  { pattern = "drchuc.com/cam-on*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/cam-on-momau*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/cam-on-tieuduong*", zone_name = "drchuc.com" },

  { pattern = "drchuc.com/ebook-momau*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-mat-co*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/cam-on-mat-co*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/camnang-mat-co*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-5-chi-so-lao-hoa*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-camnan-tieuduong*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-doc-camnang-momau*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-doc-camnang-tieuduong*", zone_name = "drchuc.com" },

  { pattern = "drchuc.com/kiem-tra-lao-hoa*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/kiem-tra-loang-xuong*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/kiem-tra-mo-noi-tang*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/kiem-tra-phoi*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/qua-phoi*", zone_name = "drchuc.com" },

  # Sale page Tư Vấn 1-1
  { pattern = "drchuc.com/tu-van-1-1*", zone_name = "drchuc.com" },

  # Cửa hàng ebook (sinh từ production/ebook-store/dung_trang.py)
  { pattern = "drchuc.com/thu-vien-ebook*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-50-bai-tap*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-thanh-toan*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/ebook-cam-on*", zone_name = "drchuc.com" },
  { pattern = "drchuc.com/tai-ve/*", zone_name = "drchuc.com" },

  # Sale page Khí Công Trường Thọ
  { pattern = "drchuc.com/khi-cong-truong-tho*", zone_name = "drchuc.com" }
]

[assets]
directory = "."
