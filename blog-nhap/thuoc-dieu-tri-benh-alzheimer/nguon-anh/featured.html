<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Lora:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"><style>
html,body{width:1200px;height:630px}
body{background:linear-gradient(135deg,#0f2238 0%,#1a2e4a 46%,#0e5a56 100%);position:relative;color:#fff}
.glow{position:absolute;left:640px;top:-40px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(42,157,143,.55) 0%,rgba(42,157,143,.18) 45%,transparent 70%)}
.ring{position:absolute;left:700px;top:30px;width:500px;height:500px;border-radius:50%;border:2px solid rgba(224,168,0,.28)}
.photo{position:absolute;width:1058px;left:471px;top:-351px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.txt{position:absolute;left:64px;top:58px;width:590px}
.pill{display:inline-block;background:var(--gold);color:#16243a;font-weight:800;font-size:18px;letter-spacing:1.6px;padding:9px 18px;border-radius:99px}
h1{font-family:'Lora',serif;font-size:64px;line-height:1.08;margin-top:26px;letter-spacing:-.5px}
.sub{font-size:27px;font-weight:600;color:#bfe7e1;margin-top:18px;line-height:1.3}
.sub b{color:#ffd76a}
.chips{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.chips span{display:inline-flex;align-items:center;gap:12px;font-size:21px;font-weight:600;color:#e6f4f1}
.chips b{display:inline-grid;place-items:center;min-width:46px;height:34px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.12);color:#ffd76a;font-weight:800}
.tag{position:absolute;right:34px;top:30px;font-size:19px;font-weight:700;color:#e6f4f1;background:rgba(15,34,56,.55);padding:8px 14px;border-radius:10px}
.tag em{font-style:normal;color:#ffd76a}
</style></head><body>
<div class="glow"></div><div class="ring"></div>
<img class="photo" src="chan-dung.png" alt="">
<div class="tag">Bác sĩ Chúc · <em>drchuc.com</em></div>
<div class="txt">
  <span class="pill">SỨC KHỎE NÃO BỘ</span>
  <h1>Thuốc mới cho bệnh Alzheimer</h1>
  <p class="sub">Làm chậm được — <b>liệu có phòng ngừa được?</b></p>
  <div class="chips"><span><b>2</b>thuốc làm chậm bệnh</span><span><b>4</b>thử nghiệm phòng ngừa</span><span><b>14</b>yếu tố có thể thay đổi</span></div>
</div>
</body></html>
