<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
#lxq-root{--teal:#4f46e5;--teal-d:#4338ca;--teal-l:#eef2ff;--ink:#1f2937;--muted:#6b7280;
  --line:#e5e7eb;--bg:#ffffff;--radius:16px;--maxw:600px;
  font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);line-height:1.55;max-width:var(--maxw);margin:0 auto;padding:0 4px;-webkit-font-smoothing:antialiased;}
#lxq-root *{box-sizing:border-box;}
.lxq-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 10px 30px -12px rgba(79,70,229,.25);overflow:hidden;}
.lxq-bar{height:7px;background:#e7e5ff;}
.lxq-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#818cf8,#4f46e5);border-radius:0 7px 7px 0;box-shadow:0 0 8px rgba(79,70,229,.45);transition:width .35s ease;}
.lxq-body{padding:26px 22px 24px;}
.lxq-eyebrow{color:var(--teal);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;}
.lxq-h1{font-size:23px;line-height:1.3;font-weight:800;margin:0 0 10px;}

.lxq-opts{display:flex;flex-direction:column;gap:10px;margin-top:6px;}

.lxq-btn.primary:hover{background:var(--teal-d);}

<script>
(function(){
  "use strict";
  /* ===== ★ SỬA 1 — CẤU HÌNH ===== */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbfgiMoGH0rL-Ft7Qh344deWVHB7ZdZV6DrfGRxHswuJ_ap-gXXF-tLJ74A47q_Ki8Pg/exec';     // URL .../exec của Apps Script
  var SECRET     = 'magie-quiz-2026-drc';        // PHẢI trùng SECRET file .gs
  var CTA_URL    = 'https://zalo.me/0947578088'; // nút cuối: nhắn inbox nhận phân tích (09/11 anh chốt: không dẫn thẳng sang trang bán)
  /* ================================================================ */

  // ★ SỬA 2 — Tiêu đề câu hỏi (T) = TÊN CỘT Sheet. Nhãn lựa chọn (O) để chấm điểm. TRÙNG y hệt file .gs.
  var T = {
    ten:'Họ và tên của bạn', email:'Email của bạn', sdt:'Số điện thoại / Zalo',
    gioi:'Giới tính?', tuoi:'Bạn bao nhiêu tuổi?',
    ngu:'Giấc ngủ ban đêm của bạn thế nào?',
    corut:'Bạn có bị chuột rút, giật mí mắt hay máy/giật cơ không?',
    thankinh:'Bạn có hay bồn chồn, lo âu, hồi hộp, khó thư giãn không?',
    nangluong:'Bạn có hay mệt mỏi uể oải, chân bồn chồn khi nằm, hoặc táo bón không?',
    loisong:'Lối sống của bạn có điều nào sau đây?',
    thantrong:'Bạn có thuộc nhóm nào cần thận trọng sau đây không?'
  };
  var O = {
    ngu_tot:'Ngủ ngon — vào giấc nhanh, ngủ thẳng tới sáng',
    ngu_tt:'Thỉnh thoảng trằn trọc, nhìn chung vẫn ổn',
    ngu_dey:'Tuần vài đêm khó vào giấc hoặc hay tỉnh giữa đêm',
    ngu_ro:'Gần như đêm nào cũng trằn trọc / tỉnh lúc 2–3h sáng',
    cr_khong:'Không bị',
    cr_nhe:'Hiếm khi — thỉnh thoảng giật mí mắt nhẹ',
    cr_vua:'Chuột rút bắp chân hoặc giật mí vài lần mỗi tuần',
    cr_nhieu:'Đêm nào cũng chuột rút tỉnh giấc / máy cơ nhiều',
    tk_tot:'Dễ thả lỏng, buổi tối thấy thư thái',
    tk_tt:'Thỉnh thoảng căng thẳng, nhìn chung ổn',
    tk_dey:'Hay bồn chồn, khó thư giãn vào buổi tối',
    tk_ro:'Thường xuyên hồi hộp, tim đập nhanh, đầu óc không ngừng nghĩ',
    nl_tot:'Khỏe khoắn, tiêu hóa đều',
    nl_tt:'Thỉnh thoảng mệt hoặc táo nhẹ',
    nl_dey:'Hay uể oải dù ngủ đủ, hoặc chân bồn chồn khi nằm',
    nl_ro:'Mệt kéo dài + chân bồn chồn + hay táo bón',
    ls_stress:'Hay căng thẳng, stress kéo dài',
    ls_ruou:'Uống bia/rượu thường xuyên',
    ls_itrau:'Ăn ít rau xanh đậm và các loại hạt',
    ls_mohoi:'Hay đổ mồ hôi nhiều (tập nặng, làm ngoài nóng)',
    ls_caphe:'Uống nhiều cà phê hoặc nước ngọt',
    ls_none:'Không có điều nào ở trên',
    tt_than:'Có bệnh thận / suy thận',
    tt_thuoc:'Đang dùng thuốc (lợi tiểu, kháng sinh, thuốc dạ dày…) hoặc có bệnh mạn tính',
    tt_thai:'Đang mang thai hoặc cho con bú',
    tt_none:'Không thuộc nhóm nào ở trên'
  };

  var A = {}; // đáp án

  // ★ SỬA 3 — Danh sách câu hỏi.
  var steps = [
    {type:'intro'},
    {type:'single', key:T.gioi, q:'Giới tính của bạn?', opts:['Nam','Nữ']},
    {type:'number', key:T.tuoi, q:'Bạn bao nhiêu tuổi?', hint:'Có thể kiểm tra hộ người thân — nhập tuổi người được kiểm tra.', unit:'tuổi', min:15, max:100},
    {type:'single', key:T.ngu, q:T.ngu, hint:'Chọn mức đúng nhất với 2–4 tuần gần đây.',
      opts:[O.ngu_tot,O.ngu_tt,O.ngu_dey,O.ngu_ro]},
    {type:'single', key:T.corut, q:T.corut,
      opts:[O.cr_khong,O.cr_nhe,O.cr_vua,O.cr_nhieu]},
    {type:'single', key:T.thankinh, q:T.thankinh,
      opts:[O.tk_tot,O.tk_tt,O.tk_dey,O.tk_ro]},
    {type:'single', key:T.nangluong, q:T.nangluong,
      opts:[O.nl_tot,O.nl_tt,O.nl_dey,O.nl_ro]},
    {type:'multi', key:T.loisong, q:'Lối sống của bạn có điều nào sau đây? (chọn tất cả đúng)',
      hint:'Đây là những thứ bào mòn Magie thầm lặng.',
      opts:[O.ls_stress,O.ls_ruou,O.ls_itrau,O.ls_mohoi,O.ls_caphe], none:O.ls_none},
    {type:'multi', key:T.thantrong, q:'Bạn có thuộc nhóm nào cần thận trọng sau đây không? (chọn tất cả đúng)',
      hint:'Để Bác sĩ dặn đúng cách bổ sung AN TOÀN cho riêng bạn.',
      opts:[O.tt_than,O.tt_thuoc,O.tt_thai], none:O.tt_none},
    {type:'contact'},
    {type:'result'}
  ];

  var idx = 0;
  var body = document.getElementById('lxqBody');
  var prog = document.getElementById('lxqProg');

  function visible(i){ var s=steps[i]; return !s.showIf || s.showIf(); }
  function totalQ(){ var n=0; for(var i=0;i<steps.length;i++){var t=steps[i].type; if(t!=='intro'&&t!=='result'&&visible(i))n++;} return n; }
  function qIndex(){ var n=0; for(var i=0;i<=idx&&i<steps.length;i++){var t=steps[i].type; if(t!=='intro'&&t!=='result'&&visible(i))n++;} return n; }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(){
    while(!visible(idx)) idx += (idx>0?1:1); // bỏ bước ẩn
    var s = steps[idx];
    var tot = totalQ();
    prog.style.width = (s.type==='intro'?4 : s.type==='result'?100 : Math.round(qIndex()/tot*100)) + '%';
    if(s.type==='intro')     return renderIntro();
    if(s.type==='contact')   return renderContact();
    if(s.type==='result')    return; // xử lý riêng khi submit
    renderQuestion(s);
  }

  function renderIntro(){
    body.innerHTML =
      '<p class="lxq-eyebrow">Bài tự kiểm tra · 2 phút</p>'+
      '<h2 class="lxq-h1">Bạn có đang thiếu <span style="color:var(--teal)">Magie</span> — khiến mất ngủ, chuột rút, mệt mỏi?</h2>'+
      '<p class="lxq-lead">Magie là khoáng chất "thư giãn" dễ hụt thầm lặng — mà xét nghiệm máu thường không thấy, '+
      'vì phần lớn nằm trong tế bào. Trả lời nhanh 8 câu để biết cơ thể bạn đang phát mấy tín hiệu thiếu Magie, '+
      'và nên bắt đầu từ đâu.</p>'+
      '<div class="lxq-nav"><button class="lxq-btn primary" id="lxqStart">Bắt đầu kiểm tra →</button></div>'+
      trustHTML();
    document.getElementById('lxqStart').onclick=function(){ idx++; render(); };
  }

  function renderQuestion(s){
    var chosen = A[s.key];
    var h = '<p class="lxq-eyebrow">Câu '+qIndex()+' / '+totalQ()+'</p>';
    if(s.type==='number'){
      h += '<p class="lxq-q">'+esc(s.q)+'</p>'+(s.hint?'<p class="lxq-hint">'+esc(s.hint)+'</p>':'')+
        '<div class="lxq-field" id="lxqF"><input type="number" inputmode="numeric" id="lxqNum" '+
        'min="'+s.min+'" max="'+s.max+'" placeholder="Nhập '+esc(s.unit)+'" value="'+(chosen?esc(chosen):'')+'">'+
        '<div class="lxq-err">Vui lòng nhập số hợp lệ ('+s.min+'–'+s.max+' '+esc(s.unit)+').</div></div>';
    } else {
      h += '<p class="lxq-q">'+esc(s.q)+'</p>'+(s.hint?'<p class="lxq-hint">'+esc(s.hint)+'</p>':'');
      var list = s.opts.concat(s.none?[s.none]:[]);
      h += '<div class="lxq-opts">';
      for(var i=0;i<list.length;i++){
        var v=list[i], on=false;
        if(s.type==='multi'){ on = (chosen||[]).indexOf(v)>=0; }
        else { on = chosen===v; }
        h += '<label class="lxq-opt'+(on?' on':'')+'"><input type="'+(s.type==='multi'?'checkbox':'radio')+
          '" name="lxqo" value="'+esc(v)+'"'+(on?' checked':'')+'><span>'+esc(v)+'</span></label>';
      }
      h += '</div>';
    }
    h += '<div class="lxq-nav">'+
      '<button class="lxq-btn ghost" id="lxqBack">←</button>'+
      '<button class="lxq-btn primary" id="lxqNext">Tiếp theo →</button></div>';
    body.innerHTML = h;

    document.getElementById('lxqBack').onclick=goBack;
    document.getElementById('lxqNext').onclick=function(){ nextFromQuestion(s); };

    var opts=body.querySelectorAll('.lxq-opt');
    for(var k=0;k<opts.length;k++){
      opts[k].querySelector('input').onchange=function(e){
        var val=e.target.value;
        if(s.type==='multi'){
          var noneVal=s.none;
          var cur=A[s.key]||[];
          if(val===noneVal){ cur = e.target.checked?[noneVal]:[]; }
          else { cur = cur.filter(function(x){return x!==noneVal;});
                 if(e.target.checked) cur.push(val); else cur=cur.filter(function(x){return x!==val;}); }
          A[s.key]=cur;
          syncMulti(s);
        } else {
          A[s.key]=val; syncSingle();
          setTimeout(function(){ nextFromQuestion(s); },180);
        }
      };
    }
  }
  function syncSingle(){ var os=body.querySelectorAll('.lxq-opt');
    for(var i=0;i<os.length;i++){ os[i].classList.toggle('on', os[i].querySelector('input').checked); } }
  function syncMulti(s){ var os=body.querySelectorAll('.lxq-opt'); var cur=A[s.key]||[];
    for(var i=0;i<os.length;i++){ var inp=os[i].querySelector('input');
      inp.checked = cur.indexOf(inp.value)>=0; os[i].classList.toggle('on', inp.checked); } }

  function nextFromQuestion(s){
    if(s.type==='number'){
      var el=document.getElementById('lxqNum'); var n=parseFloat(el.value);
      if(isNaN(n)||n<s.min||n>s.max){ document.getElementById('lxqF').classList.add('bad'); el.focus(); return; }
      A[s.key]=String(n);
    } else if(s.type==='multi'){
      if(!A[s.key]||A[s.key].length===0){ A[s.key]=[]; }
    } else {
      if(!A[s.key]) return;
    }
    idx++; render();
  }

  function goBack(){ idx--; while(idx>0 && !visible(idx)) idx--; render(); }

  function renderContact(){
    prog.style.width='92%';
    body.innerHTML =
      '<p class="lxq-eyebrow">Bước cuối</p>'+
      '<h2 class="lxq-h1">Xem kết quả &amp; nhận nhận xét riêng từ Bác sĩ Chúc</h2>'+
      '<p class="lxq-lead">Bác sĩ sẽ đọc bài của bạn và gửi lời khuyên cá nhân hoá qua email.</p>'+
      field('lxqTen','Họ và tên','text','VD: Nguyễn Văn A','Vui lòng nhập họ tên.')+
      field('lxqEmail','Email','email','ten@email.com','Email chưa đúng định dạng (thiếu @ hoặc đuôi).')+
      field('lxqSdt','Số điện thoại / Zalo <span style="color:#9ca3af;font-weight:400">(không bắt buộc)</span>','tel','VD: 0912345678','SĐT phải 10–11 số, bắt đầu bằng 0.')+
      '<div class="lxq-nav">'+
        '<button class="lxq-btn ghost" id="lxqBack">←</button>'+
        '<button class="lxq-btn primary" id="lxqSubmit">Xem kết quả của tôi →</button></div>'+
      trustHTML();
    document.getElementById('lxqBack').onclick=goBack;
    document.getElementById('lxqSubmit').onclick=submit;
  }
  function field(id,label,type,ph,err){
    return '<div class="lxq-field" id="'+id+'F"><label for="'+id+'">'+label+'</label>'+
      '<input id="'+id+'" type="'+type+'" placeholder="'+ph+'" autocomplete="'+(type==='email'?'email':type==='tel'?'tel':'name')+'">'+
      '<div class="lxq-err">'+err+'</div></div>';
  }

  function submit(){
    var ten=document.getElementById('lxqTen').value.trim();
    var email=document.getElementById('lxqEmail').value.trim();
    var sdt=document.getElementById('lxqSdt').value.trim();
    var ok=true;
    if(!ten){ bad('lxqTenF'); ok=false; } else good('lxqTenF');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      setErr('lxqEmailF','Email chưa đúng định dạng (thiếu @ hoặc đuôi).'); bad('lxqEmailF'); ok=false;
    } else {
      var fix=emailFix(email);
      if(fix && email.toLowerCase()!==window.__emailKeep){
        setErr('lxqEmailF','Email có vẻ gõ nhầm. Ý bạn là <b>'+esc(fix)+'</b>? '+
          '<a href="#" id="lxqFix" style="color:#4f46e5;font-weight:700">Sửa lại</a> · '+
          '<a href="#" id="lxqKeep" style="color:#6b7280">tôi chắc chắn email đúng</a>');
        bad('lxqEmailF');
        document.getElementById('lxqFix').onclick=function(ev){ ev.preventDefault();
          document.getElementById('lxqEmail').value=fix; good('lxqEmailF'); };
        document.getElementById('lxqKeep').onclick=function(ev){ ev.preventDefault();
          window.__emailKeep=email.toLowerCase(); good('lxqEmailF'); };
        ok=false;
      } else good('lxqEmailF');
    }
    if(sdt && !/^0\d{9,10}$/.test(sdt.replace(/\s/g,''))){ bad('lxqSdtF'); ok=false; } else good('lxqSdtF');
    if(!ok) return;

    A[T.ten]=ten; A[T.email]=email; A[T.sdt]=sdt;

    var btn=document.getElementById('lxqSubmit');
    btn.disabled=true; btn.innerHTML='<span class="lxq-spin"></span>Đang gửi…';
    // Đo lường: hoàn thành quiz + để lại liên hệ → generate_lead (GTM-MWBH4FDW đọc, GA4/Pixel gắn trigger trong GTM)
    try{ window.dataLayer=window.dataLayer||[]; window.dataLayer.push({event:'generate_lead',funnel:'kiem-tra-magie',lead_source:'quiz_magie'}); }catch(e){}

    var payload={ key:SECRET, action:'submit', data:A };
    var done=false, finish=function(){ if(done)return; done=true; showResult(); };
    try{
      fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)})
        .then(finish).catch(finish);
    }catch(e){ finish(); }
    setTimeout(finish,4000);
  }
  function bad(id){ document.getElementById(id).classList.add('bad'); }
  function good(id){ document.getElementById(id).classList.remove('bad'); }
  function setErr(fid,html){ var e=document.querySelector('#'+fid+' .lxq-err'); if(e) e.innerHTML=html; }

  // Dò lỗi đánh máy tên miền email
  var GOOD_DOMAINS=['gmail.com','yahoo.com','yahoo.com.vn','hotmail.com','outlook.com',
    'outlook.com.vn','icloud.com','email.com','fpt.edu.vn'];
  function lev(a,b){ var m=a.length,n=b.length,d=[],i,j;
    for(i=0;i<=m;i++)d[i]=[i]; for(j=0;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++){ var c=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c); }
    return d[m][n]; }
  var GOOD_TLDS={com:1,net:1,org:1,edu:1,gov:1,mil:1,int:1,info:1,biz:1,name:1,pro:1,
    io:1,co:1,me:1,ai:1,app:1,dev:1,tech:1,site:1,online:1,store:1,cloud:1,email:1,live:1,xyz:1,
    tv:1,cc:1,asia:1,vn:1,us:1,uk:1,jp:1,cn:1,kr:1,de:1,fr:1,au:1,ca:1,in:1,id:1,ph:1,th:1,
    sg:1,my:1,hk:1,tw:1,ru:1,es:1,it:1,nl:1,se:1,no:1,br:1,mx:1};
  function emailFix(email){
    var at=email.lastIndexOf('@'); if(at<1) return null;
    var local=email.slice(0,at), dom=email.slice(at+1).toLowerCase();
    if(GOOD_DOMAINS.indexOf(dom)>=0) return null;
    if(/^gmail\.[a-z.]+$/.test(dom) && dom!=='gmail.com') return local+'@gmail.com';
    var best=null,bd=99;
    for(var i=0;i<GOOD_DOMAINS.length;i++){ var d=lev(dom,GOOD_DOMAINS[i]); if(d<bd){bd=d;best=GOOD_DOMAINS[i];} }
    if(best && bd>0 && bd<=2) return local+'@'+best;
    var parts=dom.split('.'), tld=parts[parts.length-1];
    if(parts.length>=2 && !GOOD_TLDS[tld]){ parts[parts.length-1]='com'; return local+'@'+parts.join('.'); }
    return null;
  }

  /* ===== ★ SỬA 4 — CHẤM ĐIỂM (JS). PHẢI khớp chamDiem_ trong .gs. ===== */
  function score(){
    function has(t,n){ var v=A[t]; if(!v)return false; if(v.join)return v.join(' | ').indexOf(n)!==-1; return String(v).indexOf(n)!==-1; }
    function val(t){ return A[t]!=null?String(A[t]):''; }
    var d=0, sig=0;
    var ngu=val(T.ngu); if(ngu===O.ngu_dey){d+=1;sig++;} else if(ngu===O.ngu_ro){d+=2;sig++;}
    var cr=val(T.corut); if(cr===O.cr_vua){d+=1;sig++;} else if(cr===O.cr_nhieu){d+=2;sig++;}
    var tk=val(T.thankinh); if(tk===O.tk_dey){d+=1;sig++;} else if(tk===O.tk_ro){d+=2;sig++;}
    var nl=val(T.nangluong); if(nl===O.nl_dey){d+=1;sig++;} else if(nl===O.nl_ro){d+=2;sig++;}
    var matNguRo=(ngu===O.ngu_ro);
    if(has(T.loisong,'stress'))d+=1;
    if(has(T.loisong,'bia/rượu'))d+=1;
    if(has(T.loisong,'ít rau xanh'))d+=1;
    if(has(T.loisong,'đổ mồ hôi'))d+=1;
    if(has(T.loisong,'cà phê'))d+=1;
    if(d<0)d=0;
    var canTT = has(T.thantrong,'thận')||has(T.thantrong,'Đang dùng thuốc')||has(T.thantrong,'mang thai');
    var safe = canTT ? '<b style="color:#dc2626">⚠️ Lưu ý an toàn:</b> vì bạn có yếu tố cần thận trọng (bệnh thận / đang dùng thuốc / thai kỳ), <b>tuyệt đối không tự ý bổ sung Magie liều cao</b> — hãy hỏi bác sĩ trước. Dưới đây là đánh giá dấu hiệu để bạn tham khảo:<br><br>' : '';
    var tang,mau,note;
    if(d>=6 || sig>=3 || (matNguRo && sig>=2)){
      tang='DẤU HIỆU RÕ'; mau='#dc2626';
      note=safe+'Bạn đang có <b>nhiều dấu hiệu gợi ý cơ thể thiếu Magie</b>. Tin tốt: Magie bổ sung lại được. '+
        'Hãy bắt đầu từ <b>ăn giàu Magie</b> (rau lá xanh đậm, hạt, đậu, cá, chuối) và giảm stress, bia rượu, cà phê. '+
        'Nếu ăn uống rồi vẫn còn dấu hiệu, có thể cân nhắc bổ sung <b>đúng dạng dễ hấp thu, êm bụng</b> vào buổi tối.';
    } else if(d>=3){
      tang='CÓ VÀI DẤU HIỆU'; mau='#d97706';
      note=safe+'Bạn có <b>một vài dấu hiệu</b> cần để ý. Hãy chủ động <b>ăn giàu Magie</b> (rau xanh đậm, hạt, đậu, chuối), '+
        'ngủ đúng giờ, giảm bia rượu và cà phê, bớt màn hình điện thoại sát giờ ngủ — rồi theo dõi lại sau 2–4 tuần.';
    } else {
      tang='ÍT DẤU HIỆU'; mau='#059669';
      note=safe+'Hiện bạn ở mức tốt — ít dấu hiệu thiếu Magie. Hãy <b>duy trì</b>: ăn đa dạng rau xanh đậm, các loại hạt, '+
        'đậu và cá; ngủ đủ giấc; hạn chế rượu bia. Nếu sau này xuất hiện mất ngủ hay chuột rút, hãy kiểm tra lại.';
    }
    return {d:d,tang:tang,mau:mau,note:note};
  }

  function showResult(){
    prog.style.width='100%';
    var r=score();
    body.innerHTML =
      '<p class="lxq-eyebrow">Đánh giá nhanh của bạn</p>'+
      '<span class="lxq-badge" style="background:'+r.mau+'22;color:'+r.mau+'">'+r.tang+'</span>'+
      '<div class="lxq-gauge" style="color:'+r.mau+'">'+r.d+'<span style="font-size:18px;color:var(--muted);font-weight:600"> điểm dấu hiệu</span></div>'+
      '<div class="lxq-result-note">'+r.note+'</div>'+
      '<p class="lxq-lead" style="margin-bottom:14px">Đây mới là <b>kết quả sàng lọc nhanh</b>. 📩 <b>Bác sĩ Chúc sẽ đọc kỹ bài của bạn và gửi PHÂN TÍCH CHI TIẾT + cách bổ sung Magie đúng cho riêng bạn qua email</b> bạn vừa nhập — nhớ kiểm tra cả mục Spam/Quảng cáo.</p>'+
      '<a class="lxq-cta" href="'+CTA_URL+'" target="_blank" rel="noopener">💬 Nhận phân tích qua email hoặc nhắn inbox Zalo →</a>'+
      authorHTML();
  }

  function trustHTML(){
    return '<div class="lxq-trust">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'+
      '<span>Thông tin của bạn được bảo mật, chỉ Bác sĩ Chúc đọc để phản hồi riêng. Đây là công cụ sàng lọc, không thay thế thăm khám.</span></div>';
  }
  function authorHTML(){
    return '<div class="lxq-author"><span>🩺</span><span>Bài tự kiểm tra do <b>Bác sĩ Nguyễn Xuân Chúc</b> biên soạn, dựa trên dấu hiệu thiếu Magie (NIH ODS) &amp; tổng quan y khoa.</span></div>';
  }

  render();
})();
